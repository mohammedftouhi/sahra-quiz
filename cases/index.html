<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملف القضايا — مكتب التحقيقات الخاصة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Dubai','Cairo',sans-serif;color:#f1ece2;background:radial-gradient(ellipse at 50% 20%,#2a2232,#07070a 70%);min-height:100vh}
.wrap{max-width:1500px;margin:0 auto;padding:4vmin}
h1{font-family:'Reem Kufi','Cairo';font-size:clamp(32px,6vmin,80px);text-align:center;margin:0;color:#f2d08a}
p.s{text-align:center;color:#9a958c;font-size:clamp(16px,2.6vmin,30px);margin:8px 0 4vmin}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3vmin}
a{display:block;text-decoration:none;color:#1a140c;background:linear-gradient(170deg,#c9b38a,#a8916a);border-radius:10px;padding:3vmin;border:4px solid transparent;transition:transform .15s,box-shadow .15s;position:relative;box-shadow:0 14px 40px rgba(0,0,0,.6)}
a:hover,a:focus{transform:scale(1.04);border-color:#fff;box-shadow:0 0 0 6px #d9b46a,0 14px 40px rgba(0,0,0,.6);outline:none}
.no{font-size:clamp(14px,2.2vmin,24px);font-weight:700;color:#4a3a22}
.t{font-family:'Reem Kufi','Cairo';font-size:clamp(22px,4vmin,48px);margin:6px 0;line-height:1.2}
.m{display:flex;gap:4px;margin-top:10px}.m i{flex:1;height:10px;border-radius:3px;background:rgba(0,0,0,.15)}.m i.on{background:#b3262c}
.k{position:absolute;top:14px;left:14px;border:3px solid #b3262c;color:#b3262c;font-weight:900;padding:2px 10px;transform:rotate(-10deg);border-radius:6px;font-size:clamp(12px,1.8vmin,20px)}
.back{display:block;text-align:center;margin-top:4vmin;color:#d9b46a;background:none;box-shadow:none;font-size:22px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<h1>🕵️ ملف القضايا</h1><p class="s">مكتب التحقيقات الخاصة · اختاروا قضية وابدأوا التحقيق</p>
<div class="grid" id="g"></div>
<a class="back" href="../">← الرجوع لمسابقات السهرة</a>
</div><script>
const C=[[5,'الصرخة في الطابق الثامن','قتل'],[6,'اختفاء العروس','خطف'],[7,'الغرفة المقفولة من الداخل','قتل'],[8,'جريمة في قطار الليل','قتل'],[9,'الشاهد ذو الريش','قتل'],[10,'العقل المدبّر','خطف وقتل']];
g.innerHTML=C.map(([n,t,k])=>`<a href="case${String(n).padStart(2,'0')}.html"><div class="k">${k}</div><div class="no">القضية رقم ${n}</div><div class="t">${t}</div><div class="m">${[...Array(10)].map((_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div></a>`).join('');
document.querySelector('#g a').focus();
</script></body></html>
