<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسابقات السهرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Dubai','Cairo',sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;
background:radial-gradient(circle at 20% 10%,#3b1d6e 0,transparent 45%),radial-gradient(circle at 85% 90%,#6e1d3b 0,transparent 45%),linear-gradient(160deg,#1a1035,#1a0a0a)}
.wrap{text-align:center;padding:4vmin;width:min(1500px,94vw)}
h1{font-size:clamp(32px,9vmin,120px);margin:0;font-weight:900}
p{color:#c7c3e6;font-size:clamp(16px,3.4vmin,44px);margin:1vmin 0 5vmin}
.row{display:flex;gap:4vmin;justify-content:center;flex-wrap:wrap}
a{flex:1;min-width:260px;max-width:520px;text-decoration:none;color:#fff;border-radius:4vmin;padding:5vmin 3vmin;border:4px solid transparent;transition:transform .15s,box-shadow .15s}
a.e{background:linear-gradient(135deg,#7c3aed,#2563eb)} a.h{background:linear-gradient(135deg,#dc2626,#9a3412)}
a .i{font-size:clamp(50px,14vmin,180px);line-height:1}
a .t{display:block;font-weight:900;font-size:clamp(22px,5vmin,70px);margin-top:1vmin}
a .s{display:block;font-size:clamp(14px,3vmin,38px);opacity:.85}
a:focus,a:hover{outline:none;border-color:#fff;box-shadow:0 0 0 .8vmin #fbbf24,0 0 6vmin rgba(251,191,36,.7);transform:scale(1.05)}
</style></head><body>
<div class="wrap">
  <h1>🧠⚡ مسابقات السهرة</h1>
  <p>اختار المستوى بالريموت واضغط OK</p>
  <div class="row">
    <a class="e" href="easy.html" id="e"><span class="i">😄</span><span class="t">المستوى العادي</span><span class="s">5 مسابقات × 50 سؤال</span></a>
    <a class="h" href="hard.html"><span class="i">🔥</span><span class="t">المستوى الصعب</span><span class="s">5 مسابقات × 50 سؤال</span></a>
    <a class="h" href="cases/" style="background:linear-gradient(135deg,#3a3040,#14101a)"><span class="i">🕵️</span><span class="t">قضايا التحقيق</span><span class="s">6 قضايا جريمة</span></a>
    <a class="h" href="games/" style="background:linear-gradient(135deg,#0f766e,#14532d)"><span class="i">🧩</span><span class="t">ألعاب التفكير</span><span class="s">هروب · الكذاب · ألغاز</span></a>
  </div>
</div>
<script>
document.getElementById('e').focus();
document.addEventListener('keydown',e=>{const L=[...document.querySelectorAll('a')];const i=L.indexOf(document.activeElement);
if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();L[(i+1)%L.length].focus();}});
</script>
</body></html>
