<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<title>مين الكذاب؟</title>
<style>
:root{--gold:#d9b46a;--gold2:#f2d08a;--red:#b3262c;--red2:#e0463a;--green:#3fbf6f;--paper:#efe7d6;--muted:#9a958c;--line:rgba(255,255,255,.12);--panel:rgba(12,12,16,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:'Dubai','Cairo',system-ui,sans-serif;color:#f1ece2}
button{font-family:inherit;color:inherit}
svg{direction:ltr}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#211c28,#07070a 75%)}
.screen{position:absolute;inset:0;display:none}.screen.on{display:block;animation:fade .5s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.btn{border:3px solid transparent;border-radius:16px;padding:16px 38px;font-size:30px;font-weight:900;cursor:pointer;background:rgba(255,255,255,.09);transition:transform .15s,border-color .15s,background .15s}
.btn:hover,.btn:focus{transform:scale(1.05);border-color:var(--gold);outline:none}
.btn.gold{background:linear-gradient(180deg,#e9c77c,#b8893a);color:#1a1206;box-shadow:0 6px 0 #6b4c18}
.btn.red{background:linear-gradient(180deg,#d0453c,#8a1a1e);box-shadow:0 6px 0 #4a0c0e}
.btn.green{background:linear-gradient(180deg,#4fd07f,#1f8a4a);box-shadow:0 6px 0 #0e4a24;color:#04140a}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.topbar{position:absolute;top:0;left:0;right:0;height:84px;display:flex;align-items:center;gap:16px;padding:0 28px;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.35));z-index:20}
.topbar .ttl{font-family:'Reem Kufi','Cairo';font-size:32px;color:var(--gold);white-space:nowrap}
.topbar .sp{flex:1}
.chip{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:8px 18px;font-size:26px;font-weight:700;white-space:nowrap}
.ibtn{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:10px 18px;font-size:24px;cursor:pointer}
.ibtn:hover{border-color:var(--gold)}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:40}
#modal.on{display:flex;animation:fade .25s}
.mcard{width:1040px;max-height:820px;overflow:auto;background:linear-gradient(180deg,#17161a,#0d0d10);border:1px solid rgba(217,180,106,.45);border-top:4px solid var(--gold);border-radius:10px;padding:34px 46px;box-shadow:0 30px 90px #000;animation:pop .3s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.mcard h2{margin:0 0 10px;font-size:44px;font-family:'Reem Kufi','Cairo';color:var(--gold2)}
.mcard p{font-size:31px;line-height:1.6;margin:8px 0}
.mcard .row{display:flex;justify-content:center;gap:16px;margin-top:24px;flex-wrap:wrap}
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.title-wrap h1{font-family:'Reem Kufi','Cairo';font-size:84px;margin:0;color:var(--gold2);text-shadow:0 6px 0 #000,0 0 40px rgba(217,180,106,.3)}
.title-wrap .sub{font-size:28px;color:var(--muted);margin:6px 0 22px;max-width:1100px;line-height:1.6}
.picks{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.pick{width:300px;border:3px solid var(--line);background:rgba(255,255,255,.05);border-radius:20px;padding:16px;cursor:pointer;text-align:center;transition:all .15s}
.pick:hover,.pick:focus{border-color:var(--gold);transform:scale(1.05);outline:none;background:rgba(217,180,106,.1)}
.pick .i{font-size:50px}.pick b{display:block;font-size:36px;margin:6px 0}.pick span{font-size:22px;color:var(--muted)}
.pick.on{border-color:var(--gold);background:rgba(217,180,106,.18)}
.toast{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#e9c77c,#b8893a);color:#1a1206;font-weight:900;font-size:28px;padding:12px 30px;border-radius:12px;z-index:35;animation:toast 2.4s forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.home{position:absolute;top:22px;left:24px;z-index:25}
#rotate{position:fixed;inset:0;background:#000;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-family:'Cairo',sans-serif;font-size:22px;z-index:99;padding:30px}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}

.file{position:absolute;top:104px;right:24px;width:470px;bottom:24px;background:linear-gradient(170deg,#c9b38a,#a8916a);color:#1a140c;border-radius:10px;padding:26px 28px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.file .ic{font-size:70px;line-height:1}
.file h2{font-family:'Reem Kufi','Cairo';font-size:42px;margin:8px 0 10px;line-height:1.2}
.file .meta{display:flex;flex-direction:column;gap:6px;font-size:22px;font-weight:700;color:#4a3a22;margin-bottom:14px}
.file h4{margin:10px 0 6px;font-size:24px;color:#7a2a12}
.file ul{margin:0;padding:0 22px 0 0;font-size:25px;line-height:1.55;font-weight:600}
.file li{margin-bottom:8px}
.file .stamp{position:absolute;left:24px;top:24px;border:5px solid var(--red);color:var(--red);font-weight:900;font-size:26px;padding:4px 14px;transform:rotate(-12deg);border-radius:8px;opacity:.85}
.wits{position:absolute;top:104px;left:24px;right:520px;bottom:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.wit{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.wit .ph{height:250px;overflow:hidden;background:#000}
.wit .ph svg{width:100%;display:block;margin-top:-10px}
.wit .nm{padding:8px 16px 4px;font-size:28px;font-weight:900}.wit .nm small{display:block;font-size:18px;color:var(--muted);font-weight:600}
.wit .ss{padding:8px 12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.sent{border:3px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:14px 14px;font-size:25px;line-height:1.5;cursor:pointer;text-align:right;transition:all .12s}
.sent:hover,.sent:focus{border-color:var(--gold);background:rgba(217,180,106,.12);outline:none}
.sent.sel{border-color:var(--gold2);background:rgba(217,180,106,.25)}
.sent.bad{border-color:var(--red2);background:rgba(224,70,58,.18);text-decoration:line-through;opacity:.7;cursor:default}
.sent.good{border-color:var(--green);background:rgba(63,191,111,.22)}
.tbar{position:absolute;top:84px;left:0;right:0;height:8px;background:rgba(255,255,255,.08);z-index:21}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e0463a,#d9b46a,#3fbf6f);transition:width .25s linear}
.turn{position:absolute;top:96px;left:50%;transform:translateX(-50%);z-index:22;display:none}
.score{display:flex;gap:10px}.score .chip.a{border-color:#3b82f6}.score .chip.b{border-color:#f97316}.score .chip.on{background:rgba(217,180,106,.25)}
.ok{color:#8fe3a8}.no{color:#ff9a8a}
</style></head><body>
<div id="rotate"><div><div style="font-size:64px">📱↻</div>اقلب الجوال بالعرض</div></div>
<div id="wrap"><div id="stage">

<section class="screen on" id="title"><div class="title-wrap">
  <div style="font-size:64px">🕵️</div><h1>مين الكذاب؟</h1>
  <div class="sub">في كل حادثة 3 شهود… واحد منهم كذاب. اقروا ملف الحادثة، واضغطوا على الجملة الكذابة قبل لا يخلص الوقت.</div>
  <div style="font-size:28px;color:var(--gold);margin-bottom:14px">١. اختاروا المستوى</div>
  <div class="picks" id="lvPicks"></div>
  <div style="font-size:28px;color:var(--gold);margin:26px 0 14px">٢. كم فريق؟</div>
  <div class="picks" id="modePicks"></div>
  <button class="btn gold" style="margin-top:30px" onclick="L.start()">🔍 ابدأ</button>
</div></section>

<section class="screen" id="round">
  <div class="tbar"><i id="tfill"></i></div>
  <div class="wits" id="wits"></div>
  <div class="file" id="file"></div>
</section>

<section class="screen" id="end"><div class="title-wrap" id="endBox"></div></section>

<div class="topbar" id="top" style="display:none">
  <div class="ttl">🕵️ مين الكذاب؟</div><div class="chip" id="rnd"></div><div class="chip" id="lvl"></div>
  <div class="sp"></div><div class="score" id="score"></div><div class="chip" id="clock">⏱ 2:00</div>
  <button class="ibtn" id="muteBtn" onclick="Snd.toggle()">🎵</button>
</div>
<div id="modal"><div class="mcard" id="mcard"></div></div>
</div></div>
<script>
/* =====================================================================
   NOIR ART — portraits & backgrounds (pure SVG, no external files)
   ===================================================================== */
const ART = (() => {
  let uid = 0;
  const id = p => `${p}${++uid}`;

  /* ---------- portrait builder ---------- */
  function face(o, g) {
    // o: {skin, skinD, hair, brow, lip, eyes}
    const F = `M200,92 C268,92 300,150 298,214 C296,280 256,330 200,336 C144,330 104,280 102,214 C100,150 132,92 200,92Z`;
    const eye = (cx, cy) => `
      <path d="M${cx-25},${cy} C${cx-12},${cy-13} ${cx+12},${cy-13} ${cx+25},${cy} C${cx+12},${cy+9} ${cx-12},${cy+9} ${cx-25},${cy}Z" fill="#e9e1d6"/>
      <circle cx="${cx+1}" cy="${cy-1}" r="9.5" fill="${o.eyes||'#3b2414'}"/><circle cx="${cx+1}" cy="${cy-1}" r="4.5" fill="#0b0806"/>
      <circle cx="${cx-3}" cy="${cy-4}" r="2.6" fill="#fff" opacity=".9"/>
      <path d="M${cx-26},${cy+1} C${cx-12},${cy-15} ${cx+12},${cy-15} ${cx+26},${cy-1}" stroke="#1a100a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M${cx-18},${cy+8} C${cx-6},${cy+12} ${cx+6},${cy+12} ${cx+18},${cy+8}" stroke="${o.skinD}" stroke-width="2" fill="none" opacity=".6"/>`;
    const browY = o.browY || 178, bt = o.browTilt || 0;
    return `
    <path d="${F}" fill="url(#${g}f)"/>
    <path d="M250,120 C292,150 300,220 288,262 C272,305 240,328 205,334 C250,300 268,240 250,120Z" fill="${o.skinD}" opacity=".55"/>
    <ellipse cx="150" cy="255" rx="26" ry="14" fill="#c46a5a" opacity=".12"/>
    ${eye(160, 210)}${eye(240, 210)}
    <path d="M${132},${browY+bt} C150,${browY-8} 172,${browY-8} 186,${browY+2}" stroke="${o.brow}" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M214,${browY+2} C228,${browY-8} 250,${browY-8} 268,${browY+bt}" stroke="${o.brow}" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M203,214 C201,238 194,254 196,264 C202,270 212,270 219,264" stroke="${o.skinD}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M186,266 C192,272 198,272 201,268" stroke="${o.skinD}" stroke-width="3" fill="none" opacity=".7"/>
    <path d="M172,294 C186,287 214,287 228,294 C214,302 186,302 172,294Z" fill="${o.lip}"/>
    <path d="M172,294 C190,297 210,297 228,294" stroke="#3a1a14" stroke-width="2.5" fill="none" opacity=".7"/>`;
  }

  function portrait(who, opt = {}) {
    const P = PEOPLE[who], g = id('p');
    const o = P;
    const silhouette = opt.shadow;
    let defs = `<defs>
      <linearGradient id="${g}f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${o.skinL}"/><stop offset=".55" stop-color="${o.skin}"/><stop offset="1" stop-color="${o.skinD}"/></linearGradient>
      <linearGradient id="${g}c" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${o.clothL}"/><stop offset="1" stop-color="${o.cloth}"/></linearGradient>
      <radialGradient id="${g}bg" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="${o.bg1||'#3a3a48'}"/><stop offset="1" stop-color="${o.bg2||'#0c0c12'}"/></radialGradient>
      <pattern id="${g}sh" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#f4f1ea"/><path d="M0,8 H16 M8,0 V16" stroke="#b3262c" stroke-width="2.4" opacity=".85"/><rect x="6" y="6" width="4" height="4" fill="#b3262c"/></pattern>
    </defs>`;
    let body = '';
    // shoulders / clothes
    const SH = `M30,500 C40,405 105,362 200,356 C295,362 360,405 370,500Z`;
    const neck = `<path d="M166,300 L234,300 L240,372 C220,384 180,384 160,372Z" fill="${o.skinD}"/>`;
    let clothes = `<path d="${SH}" fill="url(#${g}c)"/>`;
    if (o.outfit === 'suit') clothes += `<path d="M168,362 L200,440 L232,362 L222,358 L200,410 L178,358Z" fill="#e9e6e0"/><path d="M194,372 L206,372 L213,450 L200,470 L187,450Z" fill="${o.tie||'#6b1b22'}"/>
      <path d="M150,370 L190,470 L170,500 M250,370 L210,470 L230,500" stroke="#0d0d10" stroke-width="5" fill="none" opacity=".6"/>`;
    if (o.outfit === 'blazer') clothes += `<path d="M160,364 C175,390 225,390 240,364 L232,500 L168,500Z" fill="#141418"/><path d="M150,372 L188,500 M250,372 L212,500" stroke="#2a2018" stroke-width="7" opacity=".55"/>`;
    if (o.outfit === 'uniform') clothes += `<path d="M168,362 L200,425 L232,362 Z" fill="#efece6"/><path d="M182,372 L200,382 L218,372 L218,392 L200,384 L182,392Z" fill="#111"/>
      <path d="M140,380 L190,500 M260,380 L210,500" stroke="#000" stroke-width="6" opacity=".55"/><rect x="250" y="420" width="56" height="16" rx="3" fill="#c9a24a"/>`;
    if (o.outfit === 'jacket') clothes += `<path d="M175,364 C185,380 215,380 225,364 L222,500 L178,500Z" fill="#1c1c1c"/><path d="M80,420 L330,500" stroke="#111" stroke-width="12"/><rect x="250" y="440" width="90" height="56" rx="8" fill="#141414"/><circle cx="295" cy="468" r="18" fill="#2a2a2a" stroke="#555" stroke-width="3"/>`;
    if (o.outfit === 'thobe') clothes += `<path d="M178,360 C185,375 215,375 222,360 L212,420 L188,420Z" fill="#dcd8cf"/><circle cx="200" cy="395" r="3" fill="#bbb"/>`;
    if (o.outfit === 'abaya') clothes += `<path d="M196,360 L204,360 L206,500 L194,500Z" fill="${o.trim||'#6b5a3a'}" opacity=".7"/><path d="M120,420 C150,440 170,470 175,500 M280,420 C250,440 230,470 225,500" stroke="${o.trim||'#6b5a3a'}" stroke-width="4" fill="none" opacity=".6"/>`;
    if (o.outfit === 'hoodie') clothes += `<path d="M150,366 C170,410 230,410 250,366" stroke="#000" stroke-width="10" fill="none" opacity=".35"/><path d="M182,400 L178,460 M218,400 L222,460" stroke="#ddd" stroke-width="5"/><rect x="150" y="440" width="100" height="50" rx="10" fill="#000" opacity=".18"/>`;
    if (o.outfit === 'labcoat') clothes += `<path d="M175,362 L200,420 L225,362Z" fill="#3a4a6a"/><path d="M150,370 L195,500 M250,370 L205,500" stroke="#bbb" stroke-width="6"/><path d="M160,380 C150,440 250,440 240,380" stroke="#333" stroke-width="6" fill="none"/><circle cx="200" cy="440" r="12" fill="#888"/>`;
    if (o.outfit === 'dress') clothes += `${[...Array(24)].map((_,i)=>`<circle cx="${70+(i*37)%260}" cy="${380+((i*53)%110)}" r="3" fill="#fff" opacity=".45"/>`).join('')}`;
    if (o.outfit === 'conductor') clothes += `<path d="M168,362 L200,425 L232,362Z" fill="#e8e6e0"/><path d="M194,372 L206,372 L210,440 L200,452 L190,440Z" fill="#7a1a22"/><rect x="250" y="410" width="54" height="16" rx="3" fill="#d9b44a"/><circle cx="160" cy="440" r="6" fill="#d9b44a"/><circle cx="160" cy="470" r="6" fill="#d9b44a"/>`;
    if (o.outfit === 'police') clothes += `<path d="M168,362 L200,420 L232,362Z" fill="#2a3324"/><rect x="250" y="410" width="60" height="44" rx="4" fill="#4a5740"/><path d="M262,425 l12,-8 l12,8 l-12,8z" fill="#d9b44a"/><path d="M60,410 L130,380 M340,410 L270,380" stroke="#c9a24a" stroke-width="6"/>`;

    // hair / covering behind face
    let back = '', front = '';
    if (o.head === 'hijab') {
      back = `<path d="M200,58 C305,58 338,150 333,240 C330,320 345,380 368,450 C340,470 60,470 32,450 C55,380 70,320 67,240 C62,150 95,58 200,58Z" fill="${o.hijab}"/>`;
      front = `<path fill-rule="evenodd" d="M200,58 C305,58 338,150 333,240 C330,320 345,380 368,450 C340,470 60,470 32,450 C55,380 70,320 67,240 C62,150 95,58 200,58Z
        M200,126 C256,126 280,172 278,222 C276,282 246,322 200,326 C154,322 124,282 122,222 C120,172 144,126 200,126Z" fill="${o.hijab}"/>
        <path d="M200,126 C256,126 280,172 278,222 C276,282 246,322 200,326" stroke="${o.hijabD}" stroke-width="10" fill="none" opacity=".8"/>
        <path d="M110,300 C120,360 150,400 175,450 M300,290 C292,360 262,410 240,455 M90,200 C85,260 95,320 70,400" stroke="${o.hijabD}" stroke-width="6" fill="none" opacity=".6"/>`;
    } else if (o.head === 'shemagh') {
      back = `<path d="M200,52 C312,52 345,150 338,250 C335,330 350,400 380,470 L20,470 C50,400 65,330 62,250 C55,150 88,52 200,52Z" fill="url(#${g}sh)"/>`;
      front = `<path fill-rule="evenodd" d="M200,52 C312,52 345,150 338,250 C335,330 350,400 380,470 L20,470 C50,400 65,330 62,250 C55,150 88,52 200,52Z
        M200,118 C258,118 282,168 280,220 C278,282 248,324 200,328 C152,324 122,282 120,220 C118,168 142,118 200,118Z" fill="url(#${g}sh)"/>
        <path d="M200,52 C312,52 345,150 338,250 C335,330 350,400 380,470 L300,470 C310,380 300,300 290,240 C285,150 250,70 200,52Z" fill="#000" opacity=".28"/>
        <ellipse cx="200" cy="86" rx="104" ry="22" fill="none" stroke="#0b0b0b" stroke-width="11"/><ellipse cx="200" cy="74" rx="96" ry="18" fill="none" stroke="#161616" stroke-width="9"/>`;
    } else if (o.head === 'cap') {
      front = `<path d="M96,170 C92,92 150,60 204,60 C262,60 308,92 304,170 C270,150 135,150 96,170Z" fill="${o.capColor||'#1f2a1b'}"/><path d="M92,168 C140,182 262,182 308,168 C300,190 100,190 92,168Z" fill="#111"/><path d="M188,92 l12,-14 l12,14 l-12,12z" fill="#d9b44a"/>`;
    } else if (o.head === 'ghutra') {
      back = `<path d="M200,52 C312,52 345,150 338,250 C335,330 350,400 380,470 L20,470 C50,400 65,330 62,250 C55,150 88,52 200,52Z" fill="#f2f0ea"/>`;
      front = `<path fill-rule="evenodd" d="M200,52 C312,52 345,150 338,250 C335,330 350,400 380,470 L20,470 C50,400 65,330 62,250 C55,150 88,52 200,52Z
        M200,118 C258,118 282,168 280,220 C278,282 248,324 200,328 C152,324 122,282 120,220 C118,168 142,118 200,118Z" fill="#f2f0ea"/>
        <path d="M290,240 C300,330 300,400 300,470 L380,470 C350,400 335,330 338,250Z" fill="#000" opacity=".22"/><path d="M90,150 C80,250 85,350 60,450 M310,150 C318,250 320,350 330,450" stroke="#cfcac0" stroke-width="5" fill="none"/>
        <ellipse cx="200" cy="86" rx="104" ry="22" fill="none" stroke="#0b0b0b" stroke-width="11"/><ellipse cx="200" cy="74" rx="96" ry="18" fill="none" stroke="#161616" stroke-width="9"/>`;
    } else if (o.head === 'bald') {
      back = `<ellipse cx="101" cy="222" rx="13" ry="26" fill="${o.skin}"/><ellipse cx="299" cy="222" rx="13" ry="26" fill="${o.skinD}"/>`;
      front = `<path d="M102,215 C100,185 104,170 110,160" stroke="${o.hair||'#888'}" stroke-width="9" fill="none"/><path d="M298,215 C300,185 296,170 290,160" stroke="${o.hair||'#888'}" stroke-width="9" fill="none"/><ellipse cx="170" cy="120" rx="40" ry="14" fill="#fff" opacity=".12"/>`;
    } else if (o.head === 'niqab') {
      back = `<path d="M200,58 C305,58 338,150 333,240 C330,320 345,380 368,450 C340,470 60,470 32,450 C55,380 70,320 67,240 C62,150 95,58 200,58Z" fill="${o.hijab}"/>`;

/* =====================================================================
   SOUND — calm, quiet (generated)
   ===================================================================== */
const Snd = (() => {
  let ac = null, master, music, sfx, on = true, timer = null, step = 0;
  const nf = m => 440 * Math.pow(2, (m - 69) / 12);
  function init() {
    if (ac) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 1; master.connect(ac.destination);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200; lp.connect(master);
      music = ac.createGain(); music.gain.value = .55; music.connect(lp);
      sfx = ac.createGain(); sfx.gain.value = .7; sfx.connect(master);
    } catch (e) { ac = null; }
  }
  function note(m, t, dur, vol, dest, type = 'sine', att = .015) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = nf(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05);
  }
  function piano(m, t, vol = .04) { note(m, t, 2.4, vol, music, 'sine'); note(m + 12, t, 1.2, vol * .25, music, 'triangle'); }
  // A minor / F / C / E — slow, sparse
  const prog = [[45, 57, 60, 64, 69], [41, 57, 60, 65, 69], [48, 55, 60, 64, 67], [40, 56, 59, 64, 68]];
  const pat = [1, 3, 2, 4, 3, 2];
  function bar() {
    if (!ac) return;
    const t = ac.currentTime + .05, ch = prog[step % 4];
    note(ch[0], t, 5.5, .05, music, 'sine', .4);
    pat.forEach((k, i) => { if (Math.random() < .85) piano(ch[k], t + i * .9 + (i % 2 ? .05 : 0), .032); });
    step++;
  }
  function startMusic() { init(); if (!ac || timer) return; try { ac.resume(); } catch (e) {} bar(); timer = setInterval(bar, 5400); }
  function toggle() {
    on = !on; if (master) master.gain.value = on ? 1 : 0;
    document.getElementById('muteBtn').textContent = on ? '🎵' : '🔇';
  }
  const fx = {
    click() { if (!ac) return; note(84, ac.currentTime, .08, .03, sfx); },
    page() { if (!ac) return; note(76, ac.currentTime, .15, .02, sfx, 'triangle'); },
    clue() { if (!ac) return; const t = ac.currentTime; [81, 88, 93].forEach((m, i) => note(m, t + i * .09, .9, .05, sfx)); },
    none() { if (!ac) return; const t = ac.currentTime; note(64, t, .25, .03, sfx, 'triangle'); note(60, t + .12, .3, .03, sfx, 'triangle'); },
    alarm() { if (!ac) return; const t = ac.currentTime; for (let i = 0; i < 4; i++) { note(83, t + i * .22, .16, .035, sfx, 'triangle'); note(79, t + i * .22 + .11, .12, .03, sfx, 'triangle'); } },
    sting() { if (!ac) return; const t = ac.currentTime; [45, 52, 57, 60, 63].forEach(m => note(m, t, 2.6, .035, sfx, 'sine', .25)); },
    lie() { if (!ac) return; const t = ac.currentTime; note(36, t, .5, .12, sfx, 'sine', .005); [69, 73, 76].forEach(m => note(m, t + .05, .8, .05, sfx, 'triangle', .01)); },
    wrong() { if (!ac) return; const t = ac.currentTime; note(52, t, .4, .05, sfx, 'triangle'); note(47, t + .2, .6, .05, sfx, 'triangle'); },
    win() { if (!ac) return; const t = ac.currentTime; [60, 64, 67, 72, 76].forEach((m, i) => note(m, t + i * .14, 1.4, .045, sfx, 'triangle')); },
  };
  return { init, startMusic, toggle, fx };
})();

    lie:[0,0], why:'جوالها طفى من الشحن الساعة 8 وما معها شاحن… فكيف تصور فيديو الساعة 9؟' },
  { t:'يوم العيد', ic:'🎉', time:'يوم عيد الفطر', place:'بيت الجدة', facts:['الحادثة صارت أول يوم في عيد الفطر.','الكل كان مجتمع في بيت الجدة.'],
    w:[['w4',['أتذكر لأنه كان يوم العيد،','يوم 10 شوال.']],
       ['w6',['كنا نوزع العيديات على الأطفال.','وكان البيت مليان.']],
       ['w12',['صليت العيد ورجعت.','وفطرت مع الجماعة.']]],
    lie:[0,1], why:'عيد الفطر يكون أول يوم في شوال (1 شوال)… مو 10 شوال.' },
  { t:'مكالمة لندن', ic:'🌍', time:'يناير · 3:00 العصر بتوقيت الرياض', place:'مكالمة دولية', facts:['في يناير، لندن متأخرة عن الرياض 3 ساعات.','المكالمة كانت الساعة 3:00 العصر بتوقيت الرياض.'],
    w:[['w3',['كلمت أخوي في لندن.','وقال لي: صباح الخير، توني صاحي، الساعة عندي 7 الصبح.']],
       ['w9',['كنت جنبه وقت المكالمة.','وكان يتكلم بصوت عالي.']],
       ['w10',['أنا شفته يطلع من المكتب بعدها.','تقريباً 3:30.']]],
    lie:[0,1], why:'لندن متأخرة 3 ساعات بس… الساعة 3 العصر في الرياض تكون 12 الظهر في لندن، مو 7 الصبح.' },
  { t:'خسوف القمر', ic:'🌑', time:'2:00 الظهر', place:'سطح العمارة', facts:['الحادثة صارت الساعة 2:00 الظهر.','السماء كانت صافية.'],
    w:[['w11',['طلعت السطح أصور.','وكانت الشمس قوية.']],
       ['w8',['شفت خسوف القمر الساعة 2 الظهر.','وكان منظر رهيب.']],
       ['w1',['قفلت باب السطح الساعة 3.','وما كان فوق أحد.']]],
    lie:[1,0], why:'خسوف القمر يصير بالليل بس، لأن الأرض تكون بين الشمس والقمر. الساعة 2 الظهر القمر غالباً ما يبين أصلاً.' },
 ]},
];
</script>
<script>
Object.assign(PEOPLE, CAST);
const L = (() => {
  const $ = id => document.getElementById(id);
  const st = { lv: 0, teams: 1, i: 0, scores: [0, 0], turn: 0, tries: 0, t0: 0, tick: null, done: false, sel: null };
  const TEAM = ['الفريق الأزرق', 'الفريق البرتقالي'];
  const LIMIT = 120;
  function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900); $('stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
  addEventListener('resize', fit); fit();
  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
  function modal(h) { $('mcard').innerHTML = h; $('modal').classList.add('on'); }
  function close() { $('modal').classList.remove('on'); }
  function picks() {
    $('lvPicks').innerHTML = LEVELS.map((l, i) => `<div class="pick ${i === st.lv ? 'on' : ''}" tabindex="0" onclick="L.lv(${i})"><div class="i">${l.icon}</div><b>${l.name}</b><span>10 حوادث</span></div>`).join('');
    $('modePicks').innerHTML = [['👤', 'فريق واحد', 'تلعبون مع بعض'], ['👥', 'فريقين', 'بالدور، والأعلى نقاط يفوز']].map((m, i) => `<div class="pick ${i + 1 === st.teams ? 'on' : ''}" tabindex="0" onclick="L.mode(${i + 1})"><div class="i">${m[0]}</div><b>${m[1]}</b><span>${m[2]}</span></div>`).join('');
  }
  picks();
  function start() { Snd.startMusic(); Snd.fx.page(); st.i = 0; st.scores = [0, 0]; st.turn = 0; $('top').style.display = 'flex'; round(); }
  function rounds() { return LEVELS[st.lv].rounds; }
  function drawScore() {
    $('score').innerHTML = st.teams === 1 ? `<div class="chip">⭐ ${st.scores[0]}</div>` :
      TEAM.map((t, k) => `<div class="chip ${k ? 'b' : 'a'} ${st.turn === k ? 'on' : ''}">${k ? '🟠' : '🔵'} ${st.scores[k]}</div>`).join('');
  }
  function round() {
    const R = rounds()[st.i]; st.tries = 0; st.done = false; st.sel = null;
    show('round'); Snd.fx.page();
    $('rnd').textContent = `الحادثة ${st.i + 1} / ${rounds().length}`; $('lvl').textContent = LEVELS[st.lv].icon + ' ' + LEVELS[st.lv].name;
    drawScore();
    $('file').innerHTML = `<div class="stamp">ملف</div><div class="ic">${R.ic}</div><h2>${R.t}</h2>
      <div class="meta"><span>🕘 ${R.time}</span><span>📍 ${R.place}</span></div>
      <h4>📌 حقائق مؤكدة</h4><ul>${R.facts.map(f => `<li>${f}</li>`).join('')}</ul>
      <h4 style="margin-top:18px">🎯 المطلوب</h4><div style="font-size:23px;font-weight:600;line-height:1.5">واحد من الشهود كذاب. اضغطوا على الجملة اللي فيها الكذبة.${st.teams > 1 ? `<br><b>الدور: ${TEAM[st.turn]}</b>` : ''}</div>`;
    $('wits').innerHTML = R.w.map(([k, ss], wi) => `<div class="wit"><div class="ph">${ART.portrait(k)}</div><div class="nm">${PEOPLE[k].name}<small>${PEOPLE[k].role}</small></div>
      <div class="ss">${ss.map((s, si) => `<button class="sent" id="s${wi}_${si}" onclick="L.pick(${wi},${si})">«${s}»</button>`).join('')}</div></div>`).join('');
    clearInterval(st.tick); st.t0 = Date.now();
    st.tick = setInterval(() => {
      const left = Math.max(0, LIMIT - (Date.now() - st.t0) / 1000);
      $('tfill').style.width = (left / LIMIT * 100) + '%';
      $('clock').textContent = `⏱ ${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`;
      if (left <= 0 && !st.done) { clearInterval(st.tick); timeout(); }
    }, 250);
  }
  function pick(wi, si) {
    if (st.done) return; const el = $(`s${wi}_${si}`); if (el.classList.contains('bad')) return;
    Snd.fx.click(); document.querySelectorAll('.sent.sel').forEach(e => e.classList.remove('sel')); el.classList.add('sel'); st.sel = [wi, si];
    const R = rounds()[st.i];
    modal(`<h2>✋ تتهمون هالجملة؟</h2><div style="font-size:30px;line-height:1.6;border-right:5px solid var(--gold);padding:10px 20px;background:rgba(255,255,255,.05);border-radius:6px">${PEOPLE[R.w[wi][0]].name}: «${R.w[wi][1][si]}»</div>
      <div class="row"><button class="btn red" onclick="L.confirm()">إيه، هذي الكذبة!</button><button class="btn" onclick="L.close()">لا، نراجع</button></div>`);
  }
  function confirm() {
    close(); const R = rounds()[st.i], [wi, si] = st.sel, el = $(`s${wi}_${si}`);
    if (wi === R.lie[0] && si === R.lie[1]) {
      st.done = true; clearInterval(st.tick); el.classList.add('good'); Snd.fx.lie();
      const left = LIMIT - (Date.now() - st.t0) / 1000;
      const pts = st.tries === 0 ? (left > 60 ? 3 : 2) : 1;
      st.scores[st.teams > 1 ? st.turn : 0] += pts; drawScore();
      setTimeout(() => result(true, pts), 500);
    } else {
      st.tries++; el.classList.remove('sel'); el.classList.add('bad'); Snd.fx.wrong();
      if (st.tries >= 2) { st.done = true; clearInterval(st.tick); setTimeout(() => result(false, 0), 400); }
      else toast('❌ لا، هذي صحيحة… معكم محاولة وحدة بعد');
    }
  }
  function timeout() { st.done = true; Snd.fx.wrong(); result(false, 0, true); }
  function result(ok, pts, to) {
    const R = rounds()[st.i];
    $(`s${R.lie[0]}_${R.lie[1]}`).classList.add('good');
    modal(`<h2 class="${ok ? 'ok' : 'no'}">${ok ? `🎯 صح! +${pts} ${pts === 1 ? 'نقطة' : 'نقاط'}` : to ? '⏰ خلص الوقت!' : '❌ ما لقيتوها'}</h2>
      <p><b>الكذاب: ${PEOPLE[R.w[R.lie[0]][0]].name}</b> — «${R.w[R.lie[0]][1][R.lie[1]]}»</p><p style="color:#d8d0c0">💡 ${R.why}</p>
      <div class="row"><button class="btn gold" onclick="L.next()">${st.i + 1 < rounds().length ? 'الحادثة التالية ←' : 'النتيجة 🏆'}</button></div>`);
  }
  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; $('stage').appendChild(d); setTimeout(() => d.remove(), 2500); }
  function next() {
    close(); st.i++; if (st.teams > 1) st.turn = 1 - st.turn;
    if (st.i >= rounds().length) return end();
    round();
  }
  function end() {
    show('end'); Snd.fx.win(); $('clock').textContent = '🏁';
    const max = rounds().length * 3;
    let h;
    if (st.teams === 1) {
      const s = st.scores[0], r = s >= max * .8 ? 'كاشف الكذب الأسطوري 🧠' : s >= max * .55 ? 'محقق حاد 🕵️' : s >= max * .3 ? 'محقق واعد 🔍' : 'محتاجين تدريب 📚';
      h = `<div style="font-size:100px">🏆</div><h1>${s} / ${max}</h1><div class="sub">${r}</div>`;
    } else {
      const [a, b] = st.scores, w = a === b ? 'تعادل! 🤝' : `الفايز: ${a > b ? TEAM[0] : TEAM[1]} 🎉`;
      h = `<div style="font-size:100px">🏆</div><h1>${w}</h1><div class="sub">🔵 ${a} — 🟠 ${b}</div>`;
    }
    $('endBox').innerHTML = h + `<div class="picks"><button class="btn gold" onclick="location.reload()">🔁 العب من جديد</button>${st.lv < 2 ? `<button class="btn" onclick="L.lv(${st.lv + 1});L.start()">المستوى الأصعب ←</button>` : ''}</div>`;
  }
  $('modal').addEventListener('click', e => { if (e.target.id === 'modal' && !st.done) close(); });
  return { lv: i => { st.lv = i; picks(); Snd.fx && Snd.fx.click(); }, mode: m => { st.teams = m; picks(); }, start, pick, confirm, close, next };
})();
</script>
